<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Álbum do Templo - Eliza Ribeiro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header>

        <button id="menu-button"
                aria-label="Abrir menu"

                aria-controls="navigation"

        <nav id="navigation">
            <a href="index.html">Página Inicial</a>

        <div class="grid-container">

            <figure>

            </figure>

            <figure>

            <figure>
                <img src="imagens/templo-de-brasilia.jpeg" alt="Templo de Brasília" loading="lazy">

            <figure>

    <footer>
        <p>
            &copy;<span id="currentyear"></span>
            🌸 Eliza Ribeiro 🌸 Curitiba, Paraná
