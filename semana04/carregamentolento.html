<!DOCTYPE html>
<html lang="pt-BR">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Carregamento Lento de Imagens (Lazy Loading)</title>
     <link rel="stylesheet" href="estilos/carregamentolento.css">
     <script src="scripts/carregamentolento.js" defer></script>
</head>

<body>
     <header>
          <p class="subtitulo">WDD 131 – Semana 04</p>
     </header>

     <main>
          <h1>Carregamento Lento de Imagens (Lazy Loading)</h1>

          <img src="https://picsum.photos/id/237/400/650" alt="Cachorro preto em enquadramento vertical" width="400"
               height="650" loading="lazy">

          <img src="https://picsum.photos/id/1015/400/650" alt="Vale com rio e montanhas em enquadramento vertical"
               width="400" height="650" loading="lazy">

          <img src="https://picsum.photos/id/1025/400/650" alt="Cachorro envolto em manta em enquadramento vertical"
               width="400" height="650" loading="lazy">

          <img src="https://picsum.photos/id/1043/400/650" alt="Cachoeira entre rochas em enquadramento vertical"
               width="400" height="650" loading="lazy">

          <img src="https://picsum.photos/id/1069/400/650"
               alt="Águas-vivas iluminadas na água em enquadramento vertical" width="400" height="650" loading="lazy">

          <img src="https://picsum.photos/id/1084/400/650" alt="Morsas na costa em enquadramento vertical" width="400"
               height="650" loading="lazy">
     </main>

     <footer>
          <p>WDD 131 – Atividade de Aprendizagem: Lazy Loading</p>
          <p>Última modificação: <span id="ultima-modificacao"></span></p>
     </footer>
</body>

</html>
