<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela 1: Comparação de Recursos da Conta</title>
  <link rel="stylesheet" href="tabela.css">
</head>
<body>
  <main>
    <table>
      <caption>Tabela 1: Comparação de Recursos da Conta</caption>
      <thead>
        <tr>
          <th scope="col">Recurso</th>
          <th scope="col">Básico</th>
          <th scope="col">Padrão</th>
          <th scope="col">Premium</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">Acesso 24 horas</th>
          <td>✔️</td>
          <td>✔️</td>
          <td>✔️</td>
        </tr>
        <tr>
          <th scope="row">Suporte prioritário</th>
          <td>❌</td>
          <td>✔️</td>
          <td>✔️</td>
        </tr>
        <tr>
          <th scope="row">Relatórios mensais</th>
          <td>❌</td>
          <td>❌</td>
          <td>✔️</td>
        </tr>
        <tr>
          <th scope="row">Armazenamento extra</th>
          <td>❌</td>
          <td>✔️</td>
          <td>✔️</td>
        </tr>
      </tbody>
    </table>
  </main>
</body>
</html>
